&lt;h2 class=&quot;s&quot;&gt;Questions et corrections&lt;/h2&gt;
&lt;h2&gt;Partie A&lt;/h2&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;1) a.&lt;/b&gt; Expliquer brièvement la production de ce courant électrique. Identifier alors l’induit et l’inducteur.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;En approchant l’aimant, le champ magnétique qu’il crée à travers la bobine (b) augmente : la bobine (b) est soumise à un &lt;b&gt;champ magnétique variable&lt;/b&gt;. Cette variation provoque l’apparition d’une f.é.m. induite ; le circuit étant fermé, elle donne naissance à un &lt;b&gt;courant induit&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;&lt;b&gt;Inducteur&lt;/b&gt; : l’aimant (source du champ magnétique). &lt;b&gt;Induit&lt;/b&gt; : la bobine (b).&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;a1&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;
&lt;br&gt;&lt;b&gt;b.&lt;/b&gt; Identifier la nature du pôle de l’aimant qu’on a approché à la face (A).
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;Le courant traverse le milliampèremètre de M vers N : il remonte donc par la borne N et traverse la bobine de la droite vers la gauche (de N vers la face A). Sur le schéma, la partie avant (en trait plein) des spires est parcourue de haut en bas : par la règle de la main droite, le champ propre créé dans la bobine est dirigé vers la droite, donc la &lt;b&gt;face A est une face Sud&lt;/b&gt;.&lt;/p&gt;&lt;p&gt;D’après la loi de Lenz, la bobine s’oppose à l’approche de l’aimant : la face A &lt;b&gt;repousse&lt;/b&gt; le pôle approché, elle a donc la même nature que lui. Le pôle approché est un &lt;b&gt;pôle Sud&lt;/b&gt;.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;a1&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;2) a.&lt;/b&gt; En ouvrant l’interrupteur K, un courant induit apparaît dans la bobine (b). Expliquer l’apparition de ce courant et préciser son sens, par rapport au sens du courant inducteur.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;À l’ouverture, l’intensité I du courant dans le solénoïde (S) diminue jusqu’à 0 : le champ magnétique de (S) &lt;b&gt;décroît&lt;/b&gt;, ce qui soumet (b) à un champ magnétique variable. Cette variation de champ fait apparaître un courant induit dans (b), qui est un circuit fermé (R et mA).&lt;/p&gt;&lt;p&gt;D’après la loi de Lenz, le courant induit s’oppose à la diminution du champ de (S) : il crée un champ induit de &lt;b&gt;même sens&lt;/b&gt; que celui de (S). Le courant induit circule donc dans &lt;b&gt;le même sens&lt;/b&gt; que le courant inducteur.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;k0&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;
&lt;br&gt;&lt;b&gt;b.&lt;/b&gt; Reprendre la question 2-a lorsqu’on ferme l’interrupteur K.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;À la fermeture, I passe de 0 à sa valeur finale : le champ de (S) &lt;b&gt;croît&lt;/b&gt;, ce qui soumet (b) à un champ magnétique variable, d’où un courant induit.&lt;/p&gt;&lt;p&gt;D’après la loi de Lenz, ce courant s’oppose à l’augmentation du champ de (S) : il crée un champ induit de sens &lt;b&gt;contraire&lt;/b&gt; à celui de (S). Le courant induit circule donc dans le &lt;b&gt;sens contraire&lt;/b&gt; à celui du courant inducteur.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;k1&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;h2&gt;Partie B&lt;/h2&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;1)&lt;/b&gt; Parmi les tensions u&lt;sub&gt;AB&lt;/sub&gt;, u&lt;sub&gt;AM&lt;/sub&gt; et u&lt;sub&gt;MB&lt;/sub&gt;, préciser celles qui correspondent aux oscillogrammes (a) et (b).
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;&lt;b&gt;(a) correspond à u&lt;sub&gt;AM&lt;/sub&gt;&lt;/b&gt; : la voie Y₁ est reliée à A, la masse en M, et u&lt;sub&gt;AM&lt;/sub&gt; = R·i est proportionnelle à i (signal triangulaire).&lt;/p&gt;&lt;p&gt;&lt;b&gt;(b) correspond à u&lt;sub&gt;MB&lt;/sub&gt;&lt;/b&gt; : la voie Y₂ est reliée à B et inversée, l’oscilloscope affiche donc −u&lt;sub&gt;BM&lt;/sub&gt; = u&lt;sub&gt;MB&lt;/sub&gt; (signal en créneaux). La tension u&lt;sub&gt;AB&lt;/sub&gt; est celle du GBF ; elle n’est pas visualisée.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;b1&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;2)&lt;/b&gt; Montrer qu’au cours de chaque demi-période de l’oscillogramme (a), la bobine est le siège d’un phénomène d’auto-induction.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;Au cours de chaque demi-période, u&lt;sub&gt;AM&lt;/sub&gt; varie linéairement avec le temps ; comme i = u&lt;sub&gt;AM&lt;/sub&gt;/R, l’intensité i varie. Le champ magnétique créé par la bobine elle-même varie : la bobine est le siège d’une f.é.m. d’auto-induction e = −L·di/dt ≠ 0.&lt;/p&gt;&lt;p&gt;C’est ce que montre l’oscillogramme (b) : tension u&lt;sub&gt;MB&lt;/sub&gt; non nulle (constante) aux bornes de la bobine, alors que sa résistance est négligeable.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;b1&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;3)&lt;/b&gt; Exprimer la tension u&lt;sub&gt;MB&lt;/sub&gt; en fonction de R, L et du&lt;sub&gt;AM&lt;/sub&gt;/dt.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;La bobine a une résistance négligeable : u&lt;sub&gt;MB&lt;/sub&gt; = L·di/dt. Or u&lt;sub&gt;AM&lt;/sub&gt; = R·i, soit i = u&lt;sub&gt;AM&lt;/sub&gt;/R.&lt;/p&gt;&lt;p&gt;&lt;b&gt;u&lt;sub&gt;MB&lt;/sub&gt; = (L/R)·du&lt;sub&gt;AM&lt;/sub&gt;/dt&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;4)&lt;/b&gt; En déduire que l’inductance de la bobine est L = 0,5 H.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;Demi-période croissante de (a) : u&lt;sub&gt;AM&lt;/sub&gt; varie de 2 div × 2 V·div⁻¹ = 4 V pendant 2 div × 1 ms = 2 ms, soit du&lt;sub&gt;AM&lt;/sub&gt;/dt = +2·10³ V·s⁻¹ (et −2·10³ V·s⁻¹ en demi-période décroissante).&lt;/p&gt;&lt;p&gt;Sur (b), les deux niveaux sont écartés de 2 div × 0,1 V·div⁻¹ = 0,2 V : u&lt;sub&gt;MB&lt;/sub&gt; = +0,1 V puis −0,1 V autour du niveau moyen (la courbe est décalée sur l’écran). Donc |u&lt;sub&gt;MB&lt;/sub&gt;| = 0,1 V.&lt;/p&gt;&lt;p&gt;L = R·u&lt;sub&gt;MB&lt;/sub&gt; / (du&lt;sub&gt;AM&lt;/sub&gt;/dt) = 10⁴ × 0,1 / (2·10³) = &lt;b&gt;0,5 H&lt;/b&gt; ✓.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;b4&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;5)&lt;/b&gt; Calculer l’énergie magnétique maximale que peut emmagasiner la bobine.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;E&lt;sub&gt;L,max&lt;/sub&gt; = ½·L·I&lt;sub&gt;max&lt;/sub&gt;², avec I&lt;sub&gt;max&lt;/sub&gt; = U&lt;sub&gt;AM,max&lt;/sub&gt;/R.&lt;/p&gt;&lt;p&gt;L’amplitude de (a) est de 1 div × 2 V·div⁻¹ = 2 V : I&lt;sub&gt;max&lt;/sub&gt; = 2 / 10⁴ = 2·10⁻⁴ A.&lt;/p&gt;&lt;p&gt;E&lt;sub&gt;L,max&lt;/sub&gt; = ½ × 0,5 × (2·10⁻⁴)² = &lt;b&gt;1·10⁻⁸ J&lt;/b&gt; (10 nJ).&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Les deux courbes sont décalées sur l’écran (niveaux moyens à +2 div pour (a) et −2 div pour (b)) : on exploite donc leur amplitude. Si l’on lisait directement 3 div (6 V) pour (a), on obtiendrait 9·10⁻⁸ J.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;b5&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

const nice=v=&gt;{const p=10**Math.floor(Math.log10(v)),r=v/p;return(r&lt;=1?1:r&lt;=2?2:r&lt;=5?5:10)*p};
/* ---------- Simulation A ---------- */

&lt;h1&gt;Le dipôle RL : établissement du courant dans une bobine&lt;/h1&gt;
&lt;p class=&quot;sub&quot;&gt;Énoncé, correction détaillée et simulation pour vérifier vos résultats.&lt;/p&gt;

&lt;section id=&quot;sim&quot; hidden&gt;
&lt;h2 class=&quot;s&quot;&gt;Simulation&lt;/h2&gt;
&lt;div class=&quot;grid&quot;&gt;
 &lt;div class=&quot;box&quot;&gt;
  &lt;canvas id=&quot;cu&quot; width=&quot;640&quot; height=&quot;300&quot; aria-label=&quot;Tension ub en fonction du temps&quot;&gt;&lt;/canvas&gt;
  &lt;canvas id=&quot;ci&quot; width=&quot;640&quot; height=&quot;300&quot; aria-label=&quot;Intensité i en fonction du temps&quot;&gt;&lt;/canvas&gt;
  &lt;label for=&quot;sT&quot;&gt;Instant t = &lt;span id=&quot;tv&quot;&gt;&lt;/span&gt; ms (glissez aussi sur un graphique)&lt;/label&gt;
  &lt;input id=&quot;sT&quot; type=&quot;range&quot; min=&quot;0&quot; max=&quot;40&quot; step=&quot;0.1&quot; value=&quot;0&quot;&gt;
  &lt;label for=&quot;sL&quot;&gt;L = &lt;span id=&quot;vL&quot;&gt;&lt;/span&gt; H&lt;/label&gt;
  &lt;input id=&quot;sL&quot; type=&quot;range&quot; min=&quot;0.05&quot; max=&quot;0.3&quot; step=&quot;0.05&quot; value=&quot;0.1&quot;&gt;
  &lt;label for=&quot;sR&quot;&gt;R₀ = &lt;span id=&quot;vR&quot;&gt;&lt;/span&gt; Ω&lt;/label&gt;
  &lt;input id=&quot;sR&quot; type=&quot;range&quot; min=&quot;12&quot; max=&quot;60&quot; step=&quot;4&quot; value=&quot;24&quot;&gt;
  &lt;div class=&quot;row&quot;&gt;
   &lt;button class=&quot;p&quot; id=&quot;play&quot;&gt;▶ Animer&lt;/button&gt;
   &lt;button id=&quot;bA&quot;&gt;Courbe (a) : L₁ = 0,1 H&lt;/button&gt;
   &lt;button id=&quot;bB&quot;&gt;Courbe (b) : L₂ = 0,2 H&lt;/button&gt;
   &lt;button id=&quot;bH&quot;&gt;u&lt;sub&gt;b&lt;/sub&gt; = u&lt;sub&gt;R₀&lt;/sub&gt;&lt;/button&gt;
  &lt;/div&gt;
  &lt;div style=&quot;margin-top:8px&quot;&gt;
   &lt;div class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;kT&quot; checked&gt;&lt;label for=&quot;kT&quot;&gt;Tangente à u&lt;sub&gt;b&lt;/sub&gt;(t) et lecture de τ&lt;/label&gt;&lt;/div&gt;
   &lt;div class=&quot;chk&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;kR&quot;&gt;&lt;label for=&quot;kR&quot;&gt;Superposer (a) et (b) en pointillés gris (L = 0,1 H et 0,2 H, R₀ = 24 Ω)&lt;/label&gt;&lt;/div&gt;
  &lt;/div&gt;
 &lt;/div&gt;
 &lt;div class=&quot;box rd&quot;&gt;
  &lt;h2&gt;Mesures à l’instant t&lt;/h2&gt;
  &lt;div&gt;u&lt;sub&gt;b&lt;/sub&gt; = &lt;b id=&quot;ru&quot;&gt;&lt;/b&gt; · u&lt;sub&gt;R₀&lt;/sub&gt; = &lt;b id=&quot;rb&quot;&gt;&lt;/b&gt;&lt;/div&gt;
  &lt;div&gt;i = &lt;b id=&quot;ri&quot;&gt;&lt;/b&gt;&lt;/div&gt;
  &lt;div&gt;E&lt;sub&gt;L&lt;/sub&gt; = ½·L·i² = &lt;b id=&quot;re&quot;&gt;&lt;/b&gt;&lt;/div&gt;
  &lt;div id=&quot;rt&quot; class=&quot;big&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;ro&quot;&gt;&lt;/div&gt;
  &lt;div id=&quot;rd&quot; style=&quot;color:var(--mute)&quot;&gt;&lt;/div&gt;
  &lt;p class=&quot;note&quot;&gt;E = 12 V et r = 8 Ω (fixes). Le palier vaut u&lt;sub&gt;b∞&lt;/sub&gt; = rE/(R₀ + r). L’équation différentielle de l’énoncé est vérifiée à chaque instant : les deux valeurs ci-dessus sont égales.&lt;/p&gt;
 &lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;1)&lt;/b&gt; Donner un exemple de système d’acquisition permettant d’enregistrer la tension u&lt;sub&gt;b&lt;/sub&gt;(t).
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;Une &lt;b&gt;carte d’acquisition&lt;/b&gt; reliée à un ordinateur muni d’un logiciel d’acquisition (type ExAO), ou un &lt;b&gt;oscilloscope à mémoire&lt;/b&gt;, branché aux bornes de la bobine.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;2) a.&lt;/b&gt; Par application de la loi des mailles, montrer que la valeur à l’instant t₀ de la tension u&lt;sub&gt;b&lt;/sub&gt; est égale à celle aux bornes du générateur.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;Loi des mailles : E = u&lt;sub&gt;R₀&lt;/sub&gt; + u&lt;sub&gt;b&lt;/sub&gt; = R₀·i + u&lt;sub&gt;b&lt;/sub&gt;.&lt;/p&gt;&lt;p&gt;À t₀ = 0, le courant est nul (la bobine s’oppose à l’établissement brusque du courant) : i(0) = 0, donc u&lt;sub&gt;R₀&lt;/sub&gt; = 0 et &lt;b&gt;u&lt;sub&gt;b&lt;/sub&gt;(0) = E&lt;/b&gt;.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;e0&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;
&lt;br&gt;&lt;b&gt;b.&lt;/b&gt; En déduire graphiquement la valeur de la tension E.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;Sur les chronogrammes, u&lt;sub&gt;b&lt;/sub&gt;(0) = 12 V, donc &lt;b&gt;E = 12 V&lt;/b&gt;.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;e0&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;3) a.&lt;/b&gt; On désigne par τ la constante de temps du dipôle bobine-résistor. Écrire l’expression de τ en fonction de L, R₀ et r.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;La résistance totale du circuit est R₀ + r : &lt;b&gt;τ = L / (R₀ + r)&lt;/b&gt;.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;br&gt;&lt;b&gt;b.&lt;/b&gt; Déterminer graphiquement la valeur L₂ de l’inductance L.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;La tangente à l’origine coupe l’asymptote (u&lt;sub&gt;b&lt;/sub&gt; = 3 V) à l’abscisse t = τ. Par lecture : τ&lt;sub&gt;a&lt;/sub&gt; ≈ 2 carreaux et τ&lt;sub&gt;b&lt;/sub&gt; ≈ 4 carreaux, donc τ&lt;sub&gt;b&lt;/sub&gt;/τ&lt;sub&gt;a&lt;/sub&gt; = 2.&lt;/p&gt;&lt;p&gt;R₀ et r étant les mêmes pour les deux courbes, τ est proportionnelle à L : L₂ = L₁·τ&lt;sub&gt;b&lt;/sub&gt;/τ&lt;sub&gt;a&lt;/sub&gt; = 2 × 0,1 = &lt;b&gt;0,2 H&lt;/b&gt;.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;tau&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;4) a.&lt;/b&gt; L’évolution temporelle de la tension u&lt;sub&gt;b&lt;/sub&gt; aux bornes de la bobine est régie par l’équation différentielle du&lt;sub&gt;b&lt;/sub&gt;/dt + u&lt;sub&gt;b&lt;/sub&gt;/τ = rE/L. Par application de cette équation, lorsque le courant continu s’établit dans le circuit, montrer graphiquement que R₀ = 24 Ω.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;En régime permanent, u&lt;sub&gt;b&lt;/sub&gt; = constante, donc du&lt;sub&gt;b&lt;/sub&gt;/dt = 0 et u&lt;sub&gt;b∞&lt;/sub&gt;/τ = rE/L. Avec τ = L/(R₀ + r) :&lt;/p&gt;&lt;p&gt;u&lt;sub&gt;b∞&lt;/sub&gt; = rE/(R₀ + r) ⟹ R₀ = rE/u&lt;sub&gt;b∞&lt;/sub&gt; − r.&lt;/p&gt;&lt;p&gt;Graphiquement u&lt;sub&gt;b∞&lt;/sub&gt; = 3 V, donc R₀ = 8 × 12 / 3 − 8 = 32 − 8 = &lt;b&gt;24 Ω&lt;/b&gt;.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;ro&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;
&lt;br&gt;&lt;b&gt;b.&lt;/b&gt; Pour la valeur L₁, vérifier graphiquement l’équation différentielle précédente à l’instant t₀.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;À t₀ : u&lt;sub&gt;b&lt;/sub&gt;(0) = 12 V. La tangente à l’origine de (a) coupe le palier (3 V) à t = τ₁, donc sa pente vaut −(12 − 3)/τ₁ = −9/τ₁.&lt;/p&gt;&lt;p&gt;du&lt;sub&gt;b&lt;/sub&gt;/dt + u&lt;sub&gt;b&lt;/sub&gt;/τ₁ = −9/τ₁ + 12/τ₁ = 3/τ₁.&lt;/p&gt;&lt;p&gt;Avec τ₁ = L₁/(R₀ + r) = 0,1/32 = 3,125 ms (soit 2 carreaux, donc 1 carreau ≈ 1,56 ms) : 3/τ₁ = 960 V·s⁻¹. Et rE/L₁ = 8 × 12 / 0,1 = &lt;b&gt;960 V·s⁻¹&lt;/b&gt; ✓.&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;ode&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;

&lt;div class=&quot;q&quot;&gt;&lt;b&gt;5)&lt;/b&gt; On désigne par E&lt;sub&gt;L&lt;/sub&gt; l’énergie emmagasinée dans la bobine lorsque la tension u&lt;sub&gt;b&lt;/sub&gt; est égale à celle aux bornes du résistor R₀.
&lt;br&gt;&lt;b&gt;a.&lt;/b&gt; Dire si l’énergie E&lt;sub&gt;L&lt;/sub&gt; est de forme magnétique ou électrique.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;L’énergie emmagasinée dans une bobine est de forme &lt;b&gt;magnétique&lt;/b&gt; : elle est stockée dans le champ magnétique créé par le courant. (L’énergie électrique est celle d’un condensateur.)&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;
&lt;br&gt;&lt;b&gt;b.&lt;/b&gt; Montrer que cette énergie peut s’écrire E&lt;sub&gt;L&lt;/sub&gt; = L·E² / (8·R₀²). La calculer pour la valeur L₁ de l’inductance L.
&lt;details&gt;&lt;summary&gt;Voir la solution&lt;/summary&gt;&lt;div class=&quot;sol&quot;&gt;&lt;p&gt;Si u&lt;sub&gt;b&lt;/sub&gt; = u&lt;sub&gt;R₀&lt;/sub&gt;, la loi des mailles E = u&lt;sub&gt;R₀&lt;/sub&gt; + u&lt;sub&gt;b&lt;/sub&gt; donne u&lt;sub&gt;R₀&lt;/sub&gt; = E/2, donc i = E/(2R₀).&lt;/p&gt;&lt;p&gt;E&lt;sub&gt;L&lt;/sub&gt; = ½·L·i² = ½·L·E²/(4R₀²) = &lt;b&gt;L·E² / (8·R₀²)&lt;/b&gt; ✓.&lt;/p&gt;&lt;p&gt;Application numérique avec L₁ = 0,1 H, E = 12 V, R₀ = 24 Ω : E&lt;sub&gt;L&lt;/sub&gt; = 0,1 × 144 / (8 × 576) = &lt;b&gt;3,125·10⁻³ J&lt;/b&gt; ≈ 3,1 mJ.&lt;/p&gt;&lt;p class=&quot;note&quot;&gt;Cet instant correspond à u&lt;sub&gt;b&lt;/sub&gt; = 6 V, soit t = τ₁·ln 3 ≈ 3,4 ms pour la courbe (a).&lt;/p&gt;&lt;button class=&quot;sm&quot; data-act=&quot;el&quot;&gt;Vérifier&lt;/button&gt;&lt;/div&gt;&lt;/details&gt;&lt;/div&gt;
&lt;/main&gt;
&lt;script&gt;
const btnTop = document.getElementById(&quot;btnTop&quot;);

window.addEventListener(&quot;scroll&quot;, () =&gt; {
    if (window.scrollY &gt; 300) {
        btnTop.style.display = &quot;block&quot;;
    } else {
        btnTop.style.display = &quot;none&quot;;
    }
});

btnTop.addEventListener(&quot;click&quot;, () =&gt; {
    window.scrollTo({
        top: 0,
        behavior: &quot;smooth&quot;
    });
});
&lt;/script&gt;
&lt;script&gt;
const $=id=&gt;document.getElementById(id);
const E=12,r=8,TMAX=40;
const REFA={R:24,L:0.1},REFB={R:24,L:0.2};
const P={R:24,L:0.1};
let t=0,anim=null;
const tau=(p=P)=&gt;p.L/(p.R+r);
const uinf=(p=P)=&gt;r*E/(p.R+r);
const U=(x,p=P)=&gt;uinf(p)+(E-uinf(p))*Math.exp(-x/1000/tau(p));
const I=(x,p=P)=&gt;(E-U(x,p))/p.R*1000;
const dU=(x,p=P)=&gt;-(U(x,p)-uinf(p))/tau(p)/1000;
const col=n=&gt;getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const f=(v,d)=&gt;v.toFixed(d).replace(&#x27;.&#x27;,&#x27;,&#x27;);
function plot(cv,isU){
 const g=cv.getContext(&#x27;2d&#x27;),W=640,H=300,m={l:52,r:14,t:14,b:36};
 const ymax=isU?12.6:620,st=isU?2:100;
 const px=x=&gt;m.l+x/TMAX*(W-m.l-m.r),py=y=&gt;H-m.b-y/ymax*(H-m.t-m.b);
 const ink=col(&#x27;--ink&#x27;),mu=col(&#x27;--mute&#x27;),ln=col(&#x27;--line&#x27;),c1=col(&#x27;--c1&#x27;),c2=col(&#x27;--c2&#x27;),c3=col(&#x27;--c3&#x27;);
 const L=(a,b,c,d)=&gt;{g.beginPath();g.moveTo(a,b);g.lineTo(c,d);g.stroke()};
 g.clearRect(0,0,W,H);g.font=&#x27;13px system-ui,sans-serif&#x27;;g.lineWidth=1;g.strokeStyle=ln;g.fillStyle=mu;
 for(let x=0;x&lt;=TMAX;x+=5){L(px(x),m.t,px(x),H-m.b);g.textAlign=&#x27;center&#x27;;g.fillText(x,px(x),H-m.b+15)}
 for(let y=0;y&lt;=ymax;y+=st){L(m.l,py(y),W-m.r,py(y));g.textAlign=&#x27;right&#x27;;g.fillText(y,m.l-6,py(y)+4)}
 g.fillStyle=ink;g.textAlign=&#x27;center&#x27;;g.fillText(&#x27;t (ms)&#x27;,W/2,H-4);
 g.textAlign=&#x27;left&#x27;;g.fillText(isU?&#x27;ub (V)&#x27;:&#x27;i (mA)&#x27;,m.l+4,m.t+12);
 const F=isU?U:I;
 const curve=(p,color,dash)=&gt;{g.strokeStyle=color;g.lineWidth=2.5;g.setLineDash(dash||[]);g.beginPath();
  for(let k=0;k&lt;=400;k++){const x=k/400*TMAX;k?g.lineTo(px(x),py(F(x,p))):g.moveTo(px(x),py(F(x,p)))}g.stroke();g.setLineDash([])};
 if(isU){g.strokeStyle=mu;g.lineWidth=1.2;g.setLineDash([5,4]);L(px(0),py(uinf()),px(TMAX),py(uinf()));g.setLineDash([]);
  g.fillStyle=mu;g.textAlign=&#x27;right&#x27;;g.fillText(&#x27;rE/(R₀+r) = &#x27;+f(uinf(),1)+&#x27; V&#x27;,W-m.r-4,py(uinf())-6)}
 if($(&#x27;kR&#x27;).checked){curve(REFA,mu,[6,4]);curve(REFB,mu,[2,3])}
 curve(P,c1);
 const y0=F(t);
 if(isU&amp;&amp;$(&#x27;kT&#x27;).checked){
  const s=dU(t),ta=tau()*1000,a=uinf();
  g.save();g.beginPath();g.rect(m.l,m.t,W-m.l-m.r,H-m.t-m.b);g.clip();
  g.strokeStyle=c2;g.lineWidth=2;L(px(0),py(y0-s*t),px(TMAX),py(y0+s*(TMAX-t)));
  g.setLineDash([3,3]);L(px(t),py(y0),px(t),py(a));g.setLineDash([]);
  g.strokeStyle=c3;g.lineWidth=2;L(px(t),py(a),px(t+ta),py(a));
  g.fillStyle=c3;g.beginPath();g.arc(px(t+ta),py(a),5,0,7);g.fill();g.restore();
 }
 g.fillStyle=c2;g.beginPath();g.arc(px(t),py(y0),6,0,7);g.fill();
}
function draw(){
 plot($(&#x27;cu&#x27;),true);plot($(&#x27;ci&#x27;),false);
 const u=U(t),i=I(t),ta=tau()*1000;
 $(&#x27;tv&#x27;).textContent=f(t,1);$(&#x27;sT&#x27;).value=t;$(&#x27;vL&#x27;).textContent=f(P.L,2);$(&#x27;vR&#x27;).textContent=P.R;
 $(&#x27;ru&#x27;).textContent=f(u,2)+&#x27; V&#x27;;$(&#x27;rb&#x27;).textContent=f(E-u,2)+&#x27; V&#x27;;$(&#x27;ri&#x27;).textContent=f(i,0)+&#x27; mA&#x27;;
 $(&#x27;re&#x27;).textContent=f(0.5*P.L*(i/1000)**2*1000,3)+&#x27; mJ&#x27;;
 $(&#x27;rt&#x27;).textContent=&#x27;τ = L/(R₀+r) = &#x27;+f(ta,2)+&#x27; ms&#x27;;
 const lhs=dU(t)*1000+u/tau(),rhs=r*E/P.L;
 $(&#x27;ro&#x27;).innerHTML=&#x27;dub/dt + ub/τ = &#x27;+f(lhs,0)+&#x27; V·s⁻¹ ; rE/L = &#x27;+f(rhs,0)+&#x27; V·s⁻¹&#x27;;
 $(&#x27;rd&#x27;).textContent=&#x27;La tangente coupe l’asymptote à t + τ : décalage de &#x27;+f(ta,2)+&#x27; ms.&#x27;;
}
function setT(v){t=Math.max(0,Math.min(TMAX,v));draw()}
function stop(){if(anim){cancelAnimationFrame(anim);anim=null;$(&#x27;play&#x27;).textContent=&#x27;▶ Animer&#x27;}}
function setP(R,L){P.R=R;P.L=L;$(&#x27;sR&#x27;).value=R;$(&#x27;sL&#x27;).value=L}
const tHalf=()=&gt;-tau()*1000*Math.log((E/2-uinf())/(E-uinf()));
$(&#x27;play&#x27;).onclick=()=&gt;{
 if(anim){stop();return}
 $(&#x27;play&#x27;).textContent=&#x27;⏸ Pause&#x27;;if(t&gt;=TMAX-0.1)t=0;let last=performance.now();
 (function k(now){const dt=(now-last)/1000;last=now;t+=dt*8;if(t&gt;=TMAX){setT(TMAX);stop();return}setT(t);anim=requestAnimationFrame(k)})(last);
};
$(&#x27;sT&#x27;).oninput=e=&gt;{stop();setT(+e.target.value)};
$(&#x27;sL&#x27;).oninput=e=&gt;{P.L=+e.target.value;draw()};
$(&#x27;sR&#x27;).oninput=e=&gt;{P.R=+e.target.value;draw()};
$(&#x27;bA&#x27;).onclick=()=&gt;{setP(24,0.1);draw()};
$(&#x27;bB&#x27;).onclick=()=&gt;{setP(24,0.2);draw()};
$(&#x27;bH&#x27;).onclick=()=&gt;{stop();setT(tHalf())};
[&#x27;kT&#x27;,&#x27;kR&#x27;].forEach(i=&gt;$(i).onchange=draw);
[&#x27;cu&#x27;,&#x27;ci&#x27;].forEach(id=&gt;{const cv=$(id);let dn=false;
 const mv=e=&gt;{const r=cv.getBoundingClientRect();stop();setT(((e.clientX-r.left)/r.width*640-52)/(640-66)*TMAX)};
 cv.addEventListener(&#x27;pointerdown&#x27;,e=&gt;{dn=true;cv.setPointerCapture(e.pointerId);mv(e)});
 cv.addEventListener(&#x27;pointermove&#x27;,e=&gt;{if(dn)mv(e)});
 cv.addEventListener(&#x27;pointerup&#x27;,()=&gt;dn=false)});
matchMedia(&#x27;(prefers-color-scheme:dark)&#x27;).addEventListener(&#x27;change&#x27;,draw);
const simEl=$(&#x27;sim&#x27;),tog=$(&#x27;tog&#x27;);
function showSim(on){simEl.hidden=!on;tog.textContent=on?&#x27;Masquer la simulation&#x27;:&#x27;Afficher la simulation&#x27;;tog.setAttribute(&#x27;aria-expanded&#x27;,on)}
tog.onclick=()=&gt;showSim(simEl.hidden);
document.querySelectorAll(&#x27;[data-act]&#x27;).forEach(b=&gt;b.onclick=()=&gt;{
 stop();showSim(true);const a=b.dataset.act;
 $(&#x27;kT&#x27;).checked=true;$(&#x27;kR&#x27;).checked=false;setP(24,0.1);
 if(a===&#x27;e0&#x27;||a===&#x27;ode&#x27;)setT(0);
 else if(a===&#x27;tau&#x27;){$(&#x27;kR&#x27;).checked=true;setP(24,0.2);setT(0)}
 else if(a===&#x27;ro&#x27;)setT(TMAX);
 else if(a===&#x27;el&#x27;)setT(tHalf());
 simEl.scrollIntoView({behavior:&#x27;smooth&#x27;,block:&#x27;start&#x27;});
});
draw();
&lt;/script&gt;

(function(){const ds=()=&gt;[...document.querySelectorAll(&#x27;details&#x27;)];let st=[];
addEventListener(&#x27;beforeprint&#x27;,()=&gt;{st=ds().map(d=&gt;d.open);ds().forEach(d=&gt;d.open=true)});
addEventListener(&#x27;afterprint&#x27;,()=&gt;ds().forEach((d,i)=&gt;d.open=!!st[i]));
document.getElementById(&#x27;pdf&#x27;).onclick=()=&gt;window.print();})();

"></iframe></div>
<script>
(function(){
var tabs=[0,1].map(function(i){return document.getElementById('t'+i)});
var panels=[0,1].map(function(i){return document.getElementById('p'+i)});
function fit(f){try{var d=f.contentDocument;if(!d||!d.documentElement)return;var h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);if(h>0)f.style.height=h+'px';}catch(e){}}
panels.forEach(function(p){
  var f=p.querySelector('iframe');
  f.addEventListener('load',function(){
    fit(f);
    try{new ResizeObserver(function(){fit(f)}).observe(f.contentDocument.body);}catch(e){}
    setInterval(function(){fit(f)},700);
  });
});
function show(i){
  tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===i?'true':'false');});
  panels.forEach(function(p,k){if(k===i)p.removeAttribute('hidden-tab');else p.setAttribute('hidden-tab','');});
  window.scrollTo(0,0);
  fit(panels[i].querySelector('iframe'));
  try{history.replaceState(null,'',i?'#rl':'#induction');}catch(e){}
}
tabs.forEach(function(t,i){t.addEventListener('click',function(){show(i)});});
if(location.hash==='#rl')show(1);
})();
</script>
